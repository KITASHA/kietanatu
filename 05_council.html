<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>議会資料｜月見町役場</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="header"></div>

<main class="container">

    <h1>平成16年度 臨時議会資料</h1>

    <section class="panel">
      <h2>議題</h2>

      <p>
        月見町納涼祭における安全管理体制について
      </p>

      <p>
        本件については住民の混乱を避けるため、
        詳細の公開を当面見送る。
      </p>
    </section>

    <section class="panel">
      <h2>関連資料閲覧</h2>

      <p>
        関係者用資料の閲覧には管理番号が必要です。
      </p>

      <div class="code-area">
        <input
          id="archive-code"
          type="text"
          inputmode="numeric"
          placeholder="管理番号"
        >

        <button id="archive-button">
          閲覧
        </button>
      </div>

      <p id="error-message" class="error"></p>
    </section>

</main>

<div id="footer"></div>

<script src="js/include.js"></script>
<script src="js/game.js"></script>

</body>

</html>
