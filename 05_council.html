<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>議会資料｜月見町役場</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="site-title" href="02_index.html">
        月見町役場
      </a>

      <nav>
        <a href="02_index.html">トップ</a>
        <a href="03_history.html">町の歴史</a>
        <a href="04_newsletter.html">広報誌</a>
        <a href="05_council.html">議会資料</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <h1>平成16年度 臨時議会資料</h1>

    <section class="panel">
      <h2>議題</h2>

      <p>
        月見町納涼祭における安全管理体制について
      </p>

      <p>
        本件については住民の混乱を避けるため、
        詳細の公開を当面見送る。
      </p>
    </section>

    <section class="panel">
      <h2>関連資料閲覧</h2>

      <p>
        関係者用資料の閲覧には管理番号が必要です。
      </p>

      <div class="code-area">
        <input
          id="archive-code"
          type="text"
          inputmode="numeric"
          placeholder="管理番号"
        >

        <button id="archive-button">
          閲覧
        </button>
      </div>

      <p id="error-message" class="error"></p>
    </section>

  </main>

  <script src="js/game.js"></script>
</body>
</html>
