<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ｜月見町役場</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.png">
  <script type="module" src="js/app.js"></script>

</head>

<body>

  <div id="header"></div>

  <main class="container">

    <h1>お問い合わせ</h1>

    <section class="panel">

      <p>
        月見町役場へのご意見・ご要望・お問い合わせにつきましては、
        下記よりお願いいたします。
      </p>

      <p>
        ※現在、システムメンテナンスのため、お問い合わせフォームの利用を停止しております。
      </p>

      <div class="button-area">
        <button class="btn-disabled" disabled>
          お問い合わせはこちら
        </button>
      </div>

    </section>

    <section class="panel">

      <h2>アンケート</h2>

      <p>
        サービス向上のためアンケートへのご協力をお願いいたします。
      </p>

      <div class="button-area">
        <button
          type="button"
          id="restart-button"
          class="main-button"
        >
          アンケートはこちら
        </button>
      </div>

    </section>

  </main>

  <div id="footer"></div>

</body>

</html>
