<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>議会資料｜月見町役場</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="img/favicon.png">
  <script type="module" src="js/app.js"></script>

</head>

<body>

<div id="header"></div>

<main class="container">

    <h1>議会資料管理画面</h1>

    <section class="panel">
      <h2>議題</h2>

      <p>
        過去の議会資料を保管しています。
      </p>

    </section>

    <section class="panel">
      <h2>資料閲覧</h2>

      <p>
        関係者用資料の閲覧には管理番号が必要です。
      </p>

      <div class="code-area">
        <input
          id="archive-code"
          type="text"
          inputmode="numeric"
          placeholder="管理番号"
        >

        <button id="archive-button">
          閲覧
        </button>
      </div>

      <p id="error-message" class="error"></p>
    </section>

</main>

<div id="footer"></div>

</body>

</html>
