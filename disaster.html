  <h1>屋外行事における仮設設備の安全確認について</h1>

  <section class="document">

    <p>
      平成16年8月10日
    </p>

    <p>
      夏季の屋外行事では、仮設テントや照明設備、
      電源設備などが多く使用されます。
    </p>

    <p>
      行事の主催者は、設備の固定状況や電源容量、
      避難経路を事前に確認してください。
    </p>

    <p>
      特に、多数の来場者が見込まれる場合は、
      出入口付近に物品を置かず、
      緊急時の誘導経路を確保してください。
    </p>

  </section>

  <section class="document">

    <h2>確認事項</h2>

    <ul>
      <li>仮設照明や支柱が確実に固定されているか</li>
      <li>発電機や配線に異常がないか</li>
      <li>非常用照明が使用できる状態か</li>
      <li>会場の出入口が十分に確保されているか</li>
      <li>緊急時の中止基準が定められているか</li>
    </ul>

  </section>
