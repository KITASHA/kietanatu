<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>消えた夏の思い出</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="ending-page">

  <main class="ending-container">

    <section class="ending-section">

      <p class="ending-small">
        調査記録
      </p>

      <h1 class="ending-title">
        調査終了
      </h1>

      <p>
        あなたは、
        月見町で起きた事故の記録へ辿り着いた。
      </p>

      <p>
        平成16年8月15日。
      </p>

      <p>
        月見町納涼祭で重大な事故が発生し、
        その事実は町によって隠された。
      </p>

      <p>
        住民たちには記憶安定化処置が行われ、
        事故に関する記憶は失われていった。
      </p>

    </section>

    <section class="ending-section">

      <p>
        しかし、
        その人物の名前はどこにも残っていなかった。
      </p>

      <p>
        住民記録にも。
      </p>

      <p>
        戸籍にも。
      </p>

      <p>
        学校にも。
      </p>

      <p>
        病院にも。
      </p>

      <p>
        事故当日の参加者名簿にも。
      </p>

    </section>

    

    <section class="ending-section ending-last">

      <p>
        あなたは、
      </p>

      <p>
        誰の記憶を追っていたのだろう。
      </p>

      <p class="ending-end">
        END
      </p>

      <h2 class="ending-game-title">
        消えた夏の思い出
      </h2>

      <p class="ending-thanks">
        Thank you for playing.
      </p>

      <a class="main-button" href="intro.html">
        最初から始める
      </a>

    </section>

  </main>

  <script src="js/game.js"></script>

</body>

</html>
