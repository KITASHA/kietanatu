  <h1>第52回 月見町納涼祭</h1>

  <p>
    月見町の夏の風物詩「月見町納涼祭」を今年も開催します。
  </p>

  <p>
    河川敷特設会場では屋台や盆踊り、
    打ち上げ花火など様々な催しを予定しています。
  </p>

  <section class="document">

    <h2>開催概要</h2>

    <p><strong>開催日</strong>：平成16年8月15日（日）</p>

    <p><strong>時間</strong>：16:00～21:00</p>

    <p><strong>会場</strong>：月見川河川敷 特設会場</p>

    <p><strong>入場</strong>：無料</p>

  </section>

  <section class="document">

    <h2>イベント内容</h2>

    <ul>
      <li>屋台広場</li>
      <li>盆踊り大会</li>
      <li>子ども縁日</li>
      <li>打ち上げ花火（20:00開始予定）</li>
    </ul>

  </section>

  <section class="document">

    <h2>ご来場の皆さまへ</h2>

    <p>
      会場周辺は混雑が予想されます。
    </p>

    <p>
      ご来場の際は公共交通機関をご利用ください。
    </p>

    <p>
      荒天時は一部イベントを中止する場合があります。
    </p>
