    <h1>消えた夏の思い出</h1>

    <div class="intro-text">
実家を整理していた時、
古いデジカメが見つかった。

2004年の夏。

私は確かに、
あの夏祭りで恋人と過ごしたはずだった。

だが写真には、
私しか写っていない。

友人に聞いても、
誰もその人を覚えていなかった。

唯一の手掛かりは、
当時の夏祭りが開催された月見町。

町役場の資料を調べてみよう。
</div>
