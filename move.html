<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>転入・転出｜月見町</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="town-page">

  <div id="header"></div>

  <main class="town-main">

    <div class="breadcrumb">
      <a href="town.html">トップページ</a>
      <span> ＞ </span>
      <span>転入・転出</span>
    </div>

    <section class="panel">

      <h1>転入・転出</h1>

      <p>
        引っ越しに伴う各種手続きをご案内します。
      </p>

    </section>

    <section class="panel">

      <h2>転入届</h2>

      <ul>
        <li>転入から14日以内に届け出てください。</li>
        <li>前住所地の転出証明書と転入承認証明書が必要です。</li>
        <li>本人確認書類をご持参ください。</li>
      </ul>

    </section>

    <section class="panel">

      <h2>転出届</h2>

      <ul>
        <li>引っ越し予定日の3か月前から手続き可能です。承認にお時間をいただくことがあるので計画的にお願いいたします。</li>
        <li>審査の上、承認が下りた場合のみ転出証明書を発行いたします。</li>
      </ul>

    </section>

    <section class="panel">

      <h2>関連する手続き</h2>

      <ul>
        <li>国民健康保険</li>
        <li>児童手当</li>
        <li>介護保険</li>
      </ul>

    </section>

  </main>

  <div id="footer"></div>

  <script src="js/include.js"></script>

</body>

</html>
